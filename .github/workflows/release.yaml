on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - '[v]?[0-9]+.[0-9]+.[0-9]+' # semver, optional opening 'v', no extension
      - '[v]?[0-9]+.[0-9]+.[0-9]+-*' # semver, optional opening 'v', extension

name: Create Release

permissions:
  contents: write

jobs:
  build:
    name: Build Artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
        exclude:
        - os: darwin
          arch: arm64
        - os: windows
          arch: arm64
    steps:
    - name: checkout
      uses: actions/checkout@v6
    - uses: actions/setup-go@v6
      with:
        go-version-file: 'go.mod' # The Go version to download (if necessary) and use.
    - name: build
      run: make build OS=${{ matrix.os }} ARCH=${{ matrix.arch }}
    - name: Get Build Path
      # We run the command and write it to the $GITHUB_OUTPUT buffer
      id: vars
      run: |
        echo "BINARY_PATH=$(make built-name OS=${{ matrix.os }} ARCH=${{ matrix.arch }})" >> $GITHUB_OUTPUT
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        # Save each build under a unique name in the cloud storage
        name: ca-${{ matrix.os }}-${{ matrix.arch }}
        path: ${{ steps.vars.outputs.BINARY_PATH }}
        if-no-files-found: error        
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # downloads ALL artifacts from the workflow into 'dist' folder
          path: dist
          pattern: ca-*
          merge-multiple: true
      - name: Release
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          # This tells the action to grab everything in the dist folder
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # provided by Actions
